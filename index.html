<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陈聪惠 · 数据分析作品集</title>
<style>
  :root{ --bg:#FFFFFF; --card:#EEF3F8; --primary:#A8C0D6; --accent:#5A7D9C; --text:#333333; --muted:#6B7A8D; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.9}
  .container{max-width:880px;margin:0 auto;padding:70px 24px}
  .hero{text-align:center;padding-bottom:36px}
  .hero h1{font-size:32px;font-weight:600}
  .hero p{color:var(--muted);margin-top:10px;font-size:15px}
  .card{background:var(--card);border-radius:12px;padding:22px;margin-bottom:16px;display:block;text-decoration:none;color:var(--text);transition:.2s}
  .card:hover{background:#E3EAF3}
  .card h2{font-size:17px;color:var(--accent);margin-bottom:6px}
  .card p{font-size:14px;color:var(--muted);margin-bottom:6px}
  .card .link{font-size:13px;color:var(--accent)}
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>陈聪惠</h1>
    <p>数据分析 · 数据可视化 · 求职作品集</p>
  </div>

  <a class="card" href="https://chenconghui-yyazj.github.io/recruitment-data-analysis/">
    <h2>上市公司招聘数据分析</h2>
    <p>基于招聘大数据的人才需求变化分析与就业趋势研判</p>
    <span class="link">查看项目 →</span>
  </a>

  <!-- 以后加项目：复制上面这段卡片，改标题、简介、链接 -->
</div>
</body>
</html>
